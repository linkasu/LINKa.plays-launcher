on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  license-scope:
    name: Licensing publication guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test licensing guard
        run: python3 .github/scripts/licensing-deployment-guard.py --self-test
      - id: scope
        run: python3 .github/scripts/licensing-deployment-guard.py


  build:

    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    env:
      Solution_Name: LINKa.plays-launcher.sln                         # Replace with your solution name, i.e. MyWpfApp.sln.
      
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 6.0.x
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.1
    - name: Restore packages
      run: nuget restore $env:Solution_Path 
      
    - name: Build solution
      run: msbuild $env:Solution_Path /t:Build /p:Configuration=Release  

    - name: Upload artifacts
      uses: actions/upload-artifact@v2
      with:
        name: Release
        path: LINKa.plays-launcher/bin/Release/net6.0-windows/

  deploy:
   if: ${{ needs.license-scope.outputs.deploy == 'true' }}
   needs: [build, license-scope]
   runs-on: ubuntu-20.04
   steps:
    - uses: actions/download-artifact@v3
      with:
        name: Release
        path: launcher/

    - name: Display structure of downloaded files
      run: ls -R
      working-directory: launcher
    - name: Create zip file
      run: zip -r launcher.zip launcher
    - run: set -eu
    - run: mkdir "$HOME/.ssh"
    - run: echo "${{ secrets.SSH_KEY }}" > "$HOME/.ssh/key"
    - run: chmod 600 "$HOME/.ssh/key"
    - name: Deploy to server
      env:
        SSH_KEY: ${{ secrets.SSH_KEY }}      
      run: |
        cat launcher.zip | ssh -i ~/.ssh/key -o StrictHostKeyChecking=no aacidov@linka.su dd of=/var/www/linka.su/linkaplay/launcher.zip
